<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e6fd9">
<title>Self Learners · CSS 2027</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Self Learners">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --primary:#1e6fd9; --primary-dark:#1857ab; --primary-soft:#e8f1fc;
    --bg:#f7f8fa; --surface:#ffffff; --surface-alt:#f1f3f7;
    --border:#e3e6ec; --border-strong:#cfd4dd;
    --text:#1a1d23; --text-secondary:#5a6472; --text-muted:#8b95a5;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:999px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow-md:0 2px 8px rgba(16,24,40,.08);
    --nav-h:64px;
  }
  html, body { -webkit-text-size-adjust:100%; }
  body {
    font:400 14px/1.5 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 12px;
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
  }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

  .app {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---------- Top tabs (desktop pre-login) ---------- */
  .top-tabs {
    display: none;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 4px;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 12px;
    z-index: 100;
  }
  .top-tabs button {
    flex: 1;
    min-height: 40px;
    padding: 8px 14px;
    border-radius: var(--r-sm);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: background .15s, color .15s;
  }
  .top-tabs button:hover {
    background: var(--surface-alt);
    color: var(--text);
  }
  .top-tabs button.active {
    background: var(--primary);
    color: #fff;
  }

  /* ---------- Stage (iframe host) ---------- */
  .stage {
    position: relative;
    min-height: calc(100dvh - var(--nav-h) - 40px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
    display: none;
  }
  .frame.active {
    display: block;
    position: relative;
    min-height: calc(100dvh - var(--nav-h) - 40px);
    height: auto;
  }

  /* ---------- Bottom nav (mobile) ---------- */
  .bottom-nav {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: var(--nav-h);
    padding-bottom: env(safe-area-inset-bottom);
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    z-index: 900;
  }
  .bottom-nav-inner {
    display: flex;
    height: var(--nav-h);
    max-width: 640px;
    margin: 0 auto;
  }
  .bottom-nav button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 6px 4px;
    min-height: 56px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    transition: color .15s;
  }
  .bottom-nav button .ico {
    width: 22px; height: 22px;
    stroke: currentColor;
    stroke-width: 1.75;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .bottom-nav button:hover { color: var(--text-secondary); }
  .bottom-nav button.active { color: var(--primary); font-weight: 600; }

  /* ---------- Loader ---------- */
  .loader {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--text-muted);
    font-size: 13px;
    gap: 10px;
  }
  .spinner {
    width: 22px; height: 22px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Responsive ---------- */
  @media (min-width: 769px) {
    body { padding: 16px; padding-bottom: 16px; }
    .top-tabs { display: flex; }
    .bottom-nav { display: none !important; }
    .stage { min-height: calc(100dvh - 100px); }
    .frame.active { min-height: calc(100dvh - 100px); }
  }
  @media (max-width: 768px) {
    body { padding: 8px; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px); }
    .stage {
      border-radius: var(--r-md);
      min-height: calc(100dvh - var(--nav-h) - 24px);
    }
    .frame.active {
      min-height: calc(100dvh - var(--nav-h) - 24px);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Pre-login top tabs (desktop) -->
  <div class="top-tabs" id="topTabsPreLogin" role="tablist">
    <button class="active" data-page="login"       data-src="page-login.html">Sign in</button>
    <button            data-page="schedule"    data-src="page-schedule.html">Schedule</button>
    <button            data-page="eligibility" data-src="page-eligibility.html">Eligibility</button>
    <button            data-page="syllabus"    data-src="page-syllabus.html">Syllabus</button>
  </div>

  <!-- Stage: iframes mount here -->
  <div class="stage" id="stage">
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span>Loading…</span>
    </div>
  </div>
</div>

<!-- Pre-login bottom nav (mobile) -->
<nav class="bottom-nav" id="bottomNavPreLogin" role="tablist">
  <div class="bottom-nav-inner">
    <button class="active" data-page="login" data-src="page-login.html">
      <svg class="ico" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Sign in</span>
    </button>
    <button data-page="schedule" data-src="page-schedule.html">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Schedule</span>
    </button>
    <button data-page="eligibility" data-src="page-eligibility.html">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Eligibility</span>
    </button>
    <button data-page="syllabus" data-src="page-syllabus.html">
      <svg class="ico" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>Syllabus</span>
    </button>
  </div>
</nav>

<!-- Post-login bottom nav (mobile) -->
<nav class="bottom-nav" id="bottomNavPostLogin" style="display:none" role="tablist">
  <div class="bottom-nav-inner">
    <button class="active" data-mode="mcq">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
      <span>Practice</span>
    </button>
    <button data-mode="read">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z"/><path d="M4 17h15"/></svg>
      <span>Solutions</span>
    </button>
    <button data-mode="facts">
      <svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
      <span>Facts</span>
    </button>
    <button data-mode="papers">
      <svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>
      <span>Papers</span>
    </button>
  </div>
</nav>

<script>
(function () {
  const stage          = document.getElementById('stage');
  const loader         = document.getElementById('loader');
  const topTabsPre     = document.getElementById('topTabsPreLogin');
  const bottomNavPre   = document.getElementById('bottomNavPreLogin');
  const bottomNavPost  = document.getElementById('bottomNavPostLogin');

  const KEY_USER       = 'slUser';
  const KEY_POST_LOGIN = 'slPostLogin';
  const KEY_MODE       = 'slMode';
  const KEY_FACTS_READ = 'slFactsRead';

  const THEME = {
    primary: '#1e6fd9',
    primaryDark: '#1857ab',
    primarySoft: '#e8f1fc',
    bg: '#f7f8fa',
    surface: '#ffffff',
    surfaceAlt: '#f1f3f7',
    border: '#e3e6ec',
    text: '#1a1d23',
    textSecondary: '#5a6472',
    textMuted: '#8b95a5',
    success: '#0d8a5a',
    successSoft: '#e3f5ed',
    danger: '#c8352e',
    dangerSoft: '#fdecea',
    warning: '#b7791f',
    warningSoft: '#fdf6e3'
  };

  const frames = new Map();
  let activePage = null;
  let eduFrame = null;

  /* ---------- Helpers ---------- */
  function preLoginButtons() {
    return document.querySelectorAll(
      '#topTabsPreLogin button, #bottomNavPreLogin button'
    );
  }
  function postLoginButtons() {
    return document.querySelectorAll('#bottomNavPostLogin button');
  }
  function hideLoader() {
    if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
  }

  /* ---------- Pre-login page management ---------- */
  function showPage(pageId, src) {
    if (activePage === pageId) return;
    activePage = pageId;

    preLoginButtons().forEach((b) => {
      if (b.dataset.page) b.classList.toggle('active', b.dataset.page === pageId);
    });

    if (!frames.has(pageId)) {
      const iframe = document.createElement('iframe');
      iframe.className = 'frame';
      iframe.src = src;
      iframe.title = 'Self Learners · ' + pageId;
      iframe.setAttribute('loading', 'lazy');
      iframe.style.cssText = 'width:100%;border:0;display:block;background:transparent;';

      iframe.addEventListener('load', () => {
        try {
          iframe.contentWindow.postMessage({ type: 'SL_THEME', theme: THEME }, '*');
        } catch (e) { /* ignore */ }
      });

      stage.appendChild(iframe);
      frames.set(pageId, iframe);
    }

    frames.forEach((iframe, id) => {
      const isActive = id === pageId;
      iframe.classList.toggle('active', isActive);
    });

    hideLoader();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------- Post-login ---------- */
  function enterPostLogin(opts) {
    opts = opts || {};
    try { localStorage.setItem(KEY_POST_LOGIN, '1'); } catch (e) {}

    if (topTabsPre)   topTabsPre.style.display   = 'none';
    if (bottomNavPre) bottomNavPre.style.display = 'none';
    if (bottomNavPost) bottomNavPost.style.display = '';

    // Hide all pre-login frames
    frames.forEach((iframe) => {
      iframe.classList.remove('active');
    });

    if (!eduFrame) {
      const iframe = document.createElement('iframe');
      iframe.className = 'frame active';
      iframe.src = 'page-edu.html';
      iframe.title = 'Self Learners · Edu';
      iframe.style.cssText = 'width:100%;border:0;display:block;background:transparent;';

      iframe.addEventListener('load', () => {
        try {
          iframe.contentWindow.postMessage({ type: 'SL_THEME', theme: THEME }, '*');
          if (opts.user) {
            iframe.contentWindow.postMessage(
              { type: 'SL_USER', user: opts.user, isGuest: !!opts.isGuest }, '*'
            );
          }
          if (opts.mode) {
            iframe.contentWindow.postMessage({ type: 'SL_SET_MODE', mode: opts.mode }, '*');
          }
        } catch (e) {}
      });

      stage.appendChild(iframe);
      eduFrame = iframe;
      frames.set('edu', iframe);
    } else {
      eduFrame.classList.add('active');
      try {
        if (opts.user) {
          eduFrame.contentWindow.postMessage(
            { type: 'SL_USER', user: opts.user, isGuest: !!opts.isGuest }, '*'
          );
        }
        if (opts.mode) {
          eduFrame.contentWindow.postMessage({ type: 'SL_SET_MODE', mode: opts.mode }, '*');
        }
      } catch (e) {}
    }

    hideLoader();
    setActivePostButton('mcq');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function exitToLogin() {
    try {
      localStorage.removeItem(KEY_POST_LOGIN);
      localStorage.removeItem(KEY_MODE);
      localStorage.removeItem(KEY_FACTS_READ);
    } catch (e) {}

    if (bottomNavPost) bottomNavPost.style.display = 'none';
    if (topTabsPre)    topTabsPre.style.display = '';
    if (bottomNavPre)  bottomNavPre.style.display = '';

    if (eduFrame) {
      eduFrame.classList.remove('active');
      try {
        eduFrame.contentWindow.postMessage({ type: 'SL_FORCE_CLOSE_OVERLAYS' }, '*');
      } catch (e) {}
    }

    // Remove cached login frame so it reloads fresh
    if (frames.has('login')) {
      const f = frames.get('login');
      if (f.parentNode) f.parentNode.removeChild(f);
      frames.delete('login');
    }

    activePage = null;
    showPage('login', 'page-login.html');
  }

  function setActivePostButton(mode) {
    postLoginButtons().forEach((b) => {
      if (b.dataset.mode) b.classList.toggle('active', b.dataset.mode === mode);
    });
  }

  /* ---------- Wire pre-login buttons ---------- */
  preLoginButtons().forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.dataset.page && btn.dataset.src) {
        showPage(btn.dataset.page, btn.dataset.src);
      }
    });
  });

  /* ---------- Wire post-login buttons ---------- */
  postLoginButtons().forEach((btn) => {
    btn.addEventListener('click', () => {
      if (!btn.dataset.mode) return;
      setActivePostButton(btn.dataset.mode);
      if (eduFrame) {
        try {
          eduFrame.contentWindow.postMessage(
            { type: 'SL_SET_MODE', mode: btn.dataset.mode }, '*'
          );
        } catch (e) {}
      }
    });
  });

  /* ---------- postMessage from inner pages ---------- */
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || typeof d !== 'object') return;

    if (d.type === 'SL_LOGIN') {
      try {
        if (d.user) localStorage.setItem(KEY_USER, JSON.stringify(d.user));
      } catch (err) {}
      enterPostLogin({ user: d.user, isGuest: d.isGuest, mode: 'mcq' });
    } else if (d.type === 'SL_LOGOUT') {
      try { localStorage.removeItem(KEY_USER); } catch (err) {}
      exitToLogin();
    } else if (d.type === 'SL_SET_MODE_FROM_EDU') {
      setActivePostButton(d.mode);
    }
  });

  /* ---------- Boot ---------- */
  function boot() {
    let loggedIn = false;
    let savedUser = null;
    try {
      savedUser = JSON.parse(localStorage.getItem(KEY_USER) || 'null');
      loggedIn = !!localStorage.getItem(KEY_POST_LOGIN) && !!savedUser;
    } catch (e) {}

    if (loggedIn) {
      enterPostLogin({
        user: savedUser,
        isGuest: savedUser.user === 'Guest',
        mode: 'mcq'
      });
    } else {
      showPage('login', 'page-login.html');
    }
  }

  /* Expose for debugging */
  window.__enterPostLogin = enterPostLogin;
  window.__exitToLogin    = exitToLogin;

  boot();
})();
</script>

<script>
/* Service worker registration */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
