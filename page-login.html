<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e6fd9">
<title>Sign in · Self Learners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --primary:#1e6fd9; --primary-dark:#1857ab; --primary-soft:#e8f1fc;
    --bg:#f7f8fa; --surface:#ffffff; --surface-alt:#f1f3f7;
    --border:#e3e6ec; --border-strong:#cfd4dd;
    --text:#1a1d23; --text-secondary:#5a6472; --text-muted:#8b95a5;
    --success:#0d8a5a; --success-soft:#e3f5ed;
    --danger:#c8352e;  --danger-soft:#fdecea;
    --warning:#b7791f; --warning-soft:#fdf6e3;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:999px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow-md:0 2px 8px rgba(16,24,40,.08);
  }
  html, body { -webkit-text-size-adjust:100%; }
  body {
    font:400 14px/1.5 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  .wrap {
    width: 100%;
    max-width: 380px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 28px 22px 24px;
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .header p {
    font-size: 13px;
    color: var(--text-muted);
  }

  .label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    margin: 14px 0 6px;
  }

  .field {
    position: relative;
  }
  .input {
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-size: 14px;
    color: var(--text);
  }
  .input:focus {
    outline: 2px solid var(--primary);
    outline-offset: -1px;
    border-color: var(--primary);
  }
  .input.with-action {
    padding-right: 44px;
  }

  .show-btn {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: var(--r-sm);
    color: var(--text-muted);
    font-size: 15px;
  }
  .show-btn:hover { background: var(--surface-alt); color: var(--text-secondary); }
  .show-btn svg {
    width: 18px; height: 18px;
    stroke: currentColor;
    stroke-width: 1.75;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 46px;
    padding: 12px 16px;
    border-radius: var(--r-sm);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    margin-top: 20px;
  }
  .btn-primary:disabled {
    opacity: .5;
    cursor: not-allowed;
  }
  .btn-primary:not(:disabled):hover {
    filter: brightness(1.05);
  }
  .btn-ghost {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .btn-ghost:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .guest-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .status {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 16px;
    min-height: 16px;
  }

  /* Toasts */
  .toasts {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: var(--r-sm);
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    box-shadow: var(--shadow-md);
    animation: slideIn .25s ease;
  }
  .toast.success { border-left-color: var(--success); }
  .toast.error   { border-left-color: var(--danger); }
  .toast.warning { border-left-color: var(--warning); }
  .toast.info    { border-left-color: var(--primary); }
  @keyframes slideIn {
    from { transform: translateY(-8px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  @media (max-width: 400px) {
    body { padding: 12px; }
    .card { padding: 22px 18px 20px; }
    .header h1 { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="toasts" id="toasts"></div>

<div class="wrap">
  <div class="card">
    <div class="header">
      <h1>Self Learners</h1>
      <p>CSS 2027 preparation hub</p>
    </div>

    <label class="label" for="emailInput">Email or username</label>
    <div class="field">
      <input class="input" type="text" id="emailInput" placeholder="you@example.com" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>

    <label class="label" for="passwordInput">Password</label>
    <div class="field">
      <input class="input with-action" type="password" id="passwordInput" placeholder="Enter your password" autocomplete="current-password">
      <button class="show-btn" id="togglePassword" type="button" aria-label="Show password">
        <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <button class="btn btn-primary" id="loginBtn" disabled>Sign in</button>

    <div class="divider">or</div>

    <button class="btn btn-ghost" id="guestBtn">Continue as guest</button>
    <div class="guest-note">Limited to 15 questions</div>

    <div class="status" id="statusText">Loading…</div>
  </div>
</div>

<script>
(function () {
  const SHEET_ID = '17yY_LUiqMsABz7tbtAXFpZIYpHN2TJTZSxo7oJWzckI';
  const LOGIN_GID = '2076597807';
  const LOGIN_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
                    '/export?format=csv&gid=' + LOGIN_GID;
  const KEY_USER = 'slUser';

  const $ = (id) => document.getElementById(id);
  const ui = {
    email: $('emailInput'),
    pass: $('passwordInput'),
    toggle: $('togglePassword'),
    eye: $('eyeIcon'),
    login: $('loginBtn'),
    guest: $('guestBtn'),
    status: $('statusText'),
    toasts: $('toasts')
  };

  let users = [];
  let passwordVisible = false;
  let toastTimer = null;

  /* ---------- Utilities ---------- */
  function clean(v) {
    if (v == null) return '';
    return String(v)
      .replace(/[\u200B-\u200D\uFEFF\u00A0]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function parseCSVLine(line) {
    const out = [];
    let cell = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQuotes) {
        if (ch === '"' && line[i + 1] === '"') { cell += '"'; i++; }
        else if (ch === '"') inQuotes = false;
        else cell += ch;
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === ',') { out.push(clean(cell)); cell = ''; }
        else cell += ch;
      }
    }
    out.push(clean(cell));
    return out;
  }

  function toast(message, type, duration) {
    type = type || 'info';
    duration = duration || 3500;
    if (toastTimer) clearTimeout(toastTimer);
    ui.toasts.innerHTML = '';

    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = message;
    ui.toasts.appendChild(el);

    toastTimer = setTimeout(() => {
      el.style.opacity = '0';
      el.style.transition = 'opacity .2s';
      setTimeout(() => el.remove(), 220);
    }, duration);
  }

  /* ---------- Password toggle ---------- */
  ui.toggle.addEventListener('click', () => {
    passwordVisible = !passwordVisible;
    ui.pass.type = passwordVisible ? 'text' : 'password';
    if (passwordVisible) {
      ui.eye.innerHTML = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.79 21.79 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.79 21.79 0 0 1-3.17 4.19"/><path d="M1 1l22 22"/><path d="M9.5 9.5a3 3 0 0 0 4.24 4.24"/>';
    } else {
      ui.eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>';
    }
  });

  /* ---------- Fetch users ---------- */
  function fetchUsers() {
    ui.status.textContent = 'Loading…';
    ui.login.disabled = true;

    fetch(LOGIN_URL + '&_t=' + Date.now(), { cache: 'no-store' })
      .then((r) => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then((text) => {
        const lines = text.split('\n').filter((l) => l.trim());
        users = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = parseCSVLine(lines[i]);
          if (cols.length >= 2 && cols[0] && cols[1]) {
            users.push({ user: cols[0].trim(), pass: cols[1].trim() });
          }
        }
        ui.status.textContent = 'Sign in to continue';
        ui.login.disabled = false;
      })
      .catch(() => {
        ui.status.textContent = 'Unable to connect';
        ui.login.disabled = true;
        toast('Could not load user data', 'error', 4000);
      });
  }

  /* ---------- Login ---------- */
  function notifyParent(user, isGuest) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'SL_LOGIN',
          user: user,
          isGuest: !!isGuest
        }, '*');
      }
    } catch (e) {}
  }

  function handleLogin() {
    const u = ui.email.value.trim();
    const p = ui.pass.value.trim();

    if (!u || !p) {
      toast('Enter username and password', 'warning', 3000);
      return;
    }

    const match = users.find(
      (x) => x.user.toLowerCase() === u.toLowerCase() && x.pass === p
    );

    if (match) {
      toast('Welcome, ' + match.user, 'success', 1500);
      try { localStorage.setItem(KEY_USER, JSON.stringify(match)); } catch (e) {}
      setTimeout(() => notifyParent(match, false), 350);
    } else {
      toast('Invalid credentials', 'error', 3000);
      ui.status.textContent = 'Login failed';
    }
  }

  function handleGuest() {
    const guestUser = { user: 'Guest' };
    toast('Continuing as guest', 'info', 1500);
    try { localStorage.setItem(KEY_USER, JSON.stringify(guestUser)); } catch (e) {}
    setTimeout(() => notifyParent(guestUser, true), 350);
  }

  ui.login.addEventListener('click', handleLogin);
  ui.guest.addEventListener('click', handleGuest);
  ui.email.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
  ui.pass.addEventListener('keydown',  (e) => { if (e.key === 'Enter') handleLogin(); });

  fetchUsers();
})();
</script>
</body>
</html>
